[build-system]
requires = ["setuptools>=68.0", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "worklog-cli"
version = "0.1.0"
description = "Auto-generate work logs from git commits using LLM"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "openai>=1.0",
    "anthropic>=0.30",
    "pyperclip>=1.8",
    "requests>=2.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]

[project.scripts]
worklog = "worklog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
